name: Visual Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Repo to test (e.g. ChonSong/hermes-webui)'
        required: true
        default: 'ChonSong/hermes-webui'
      target_branch:
        description: 'Branch to test'
        required: true
      target_pr:
        description: 'PR number (for commenting)'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Determine target repo and branch
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "repo=${{ inputs.target_repo }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ inputs.target_branch }}" >> "$GITHUB_OUTPUT"
            echo "pr=${{ inputs.target_pr }}" >> "$GITHUB_OUTPUT"
          else
            echo "repo=${{ github.repository }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout hermes-webui (app)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.target.outputs.repo }}
          ref: ${{ steps.target.outputs.branch }}
          path: app

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install pyyaml
          pip install playwright
          playwright install --with-deps chromium

      - name: Boot hermes-webui server
        run: |
          cd app
          export HERMES_HOME=/tmp/hw-home
          export HERMES_WEBUI_STATE_DIR=/tmp/hw-state
          export HERMES_WEBUI_PORT=8788
          export HERMES_WEBUI_SKIP_ONBOARDING=1
          nohup python3 bootstrap.py --no-browser --skip-agent-install --foreground 8788 > /tmp/server.log 2>&1 &
          echo "Server PID: $!"

      - name: Wait for server health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8788/health; then
              echo "Server is healthy!"
              exit 0
            fi
            echo "Waiting for server... attempt $i/30"
            sleep 2
          done
          echo "Server failed to start"
          cat /tmp/server.log
          exit 1

      - name: Checkout hermes-webui-tests
        uses: actions/checkout@v4
        with:
          path: tests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        run: |
          cd tests
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          cd tests
          npx playwright test
        continue-on-error: false

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            tests/test-results/
            tests/reports/
            /tmp/server.log
          retention-days: 7

      - name: Post PR comment with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const resultsPath = path.join('tests', 'test-results', '.last-run.json');
            let results = {};
            if (fs.existsSync(resultsPath)) {
              results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
            }

            const status = '${{ job.status }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let body = `## Visual Regression Tests: ${status.toUpperCase()}\n\n`;
            body += `| Metric | Count |\n|--------|-------|\n`;
            body += `| Passed | ${results.passed ?? 'N/A'} |\n`;
            body += `| Failed | ${results.failed ?? 'N/A'} |\n`;
            body += `| Skipped | ${results.skipped ?? 'N/A'} |\n`;
            body += `\n[View full run](${runUrl})`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });